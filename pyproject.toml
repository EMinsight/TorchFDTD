[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photonweave"
version = "0.14.0.dev0"
description = "An open-source visual FDTD workbench with Python and CUDA"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
dependencies = ["fdtd==0.2.2", "numpy>=1.24", "scipy>=1.10", "torch>=2.2", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1"]
cuda-kernels = ["cupy-cuda12x>=13.6,<14"]

[project.scripts]
photonweave = "photonweave.cli:main"

[tool.setuptools.packages.find]
include = ["photonweave*"]

[tool.setuptools.package-data]
photonweave = ["web/**/*", "web/*", "feature_inventory.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
