# The cpu-pr suite only (docs/GPU_RUNNER_POLICY.md): CUDA tests are deselected
# here and run by hand on the lab GPU hosts as gpu-nightly and release-full.
# Every job runs on GitHub-hosted Ubuntu, and no trigger hands fork pull
# requests repository secrets, so fork code never reaches a lab GPU host.
name: Verify
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
jobs:
  cpu-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TORCHFDTD_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,gds]'
      - run: npm ci && npm run build
      - run: python scripts/run_suite.py cpu-pr --junitxml=test-results/pytest.xml
      - name: Upload per-test pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: test-results/pytest.xml
          if-no-files-found: warn
      - run: npx playwright install --with-deps chromium
      - run: python -m torchfdtd.cli serve > server.log 2>&1 &
      - run: python -c "import urllib.request,time; time.sleep(6); urllib.request.urlopen('http://127.0.0.1:8765/api/health')"
      - run: npm run test:ui
      - run: python -m build --wheel
