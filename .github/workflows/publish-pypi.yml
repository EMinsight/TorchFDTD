name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable GitHub release tag
        required: true
        default: v1.1.7
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify the published wheel, source tag and exact-commit CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python scripts/prepare_pypi_release.py --tag "$RELEASE_TAG" --dist-dir dist-pypi
          python - <<'PY'
          import json, os
          receipt = json.load(open('pypi-release.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={receipt['version']}\nsha256={receipt['sha256']}\n")
          PY
      - name: Check PyPI metadata
        run: |
          python -m pip install twine pytest
          python -m pytest --noconftest tests/test_pypi_release.py -q
          python -m twine check --strict dist-pypi/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-wheel
          path: dist-pypi/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-release-receipt
          path: pypi-release.json
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/torchfdtd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-wheel
          path: dist/
      - name: Publish the verified wheel using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          print-hash: true

  verify-install:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_SHA256: ${{ needs.prepare.outputs.sha256 }}
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify PyPI's file digest and a fresh download
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.error, urllib.request
          version, expected = os.environ['RELEASE_VERSION'], os.environ['EXPECTED_SHA256']
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(f'https://pypi.org/pypi/torchfdtd/{version}/json', timeout=20) as response:
                      metadata = json.load(response)
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 404 or attempt == 11:
                      raise
                  time.sleep(5)
          name = f'torchfdtd-{version}-py3-none-any.whl'
          wheel, = [item for item in metadata['urls'] if item['filename'] == name]
          assert wheel['digests']['sha256'] == expected
          with urllib.request.urlopen(wheel['url'], timeout=30) as response:
              downloaded = response.read()
          assert hashlib.sha256(downloaded).hexdigest() == expected
          pathlib.Path('pypi-download-verification.json').write_text(json.dumps({'version': version, 'wheel': name, 'sha256': expected, 'metadata_digest_matches': True, 'download_digest_matches': True}, indent=2))
          PY
      - name: Install from PyPI and run the installed CLI and CPU solver
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "torchfdtd==$RELEASE_VERSION"
          python -m pip check
          torchfdtd --help
          python - <<'PY'
          import importlib.metadata, json, os, pathlib, sys
          import numpy as np
          import torchfdtd
          from torchfdtd import Monitor, Project, Region, Result, Simulation, Source
          package = pathlib.Path(torchfdtd.__file__).resolve()
          assert package.is_relative_to(pathlib.Path(sys.prefix).resolve()), package
          assert importlib.metadata.version('torchfdtd') == os.environ['RELEASE_VERSION']
          project = Project(region=Region(dimension='2d', size=(2, 2, .1), mesh=.1, pml_cells=3, steps=80, backend='cpu'), sources=[Source(wavelength=1, pulse_cycles=1)], monitors=[Monitor(center=(.4, 0, 0))])
          result = Simulation(project).run()
          assert np.isfinite(result.electric).all() and np.max(np.abs(result.electric)) > 0 and np.max(np.abs(result.signals)) > 0
          result.save('pypi-probe.npz')
          np.testing.assert_array_equal(Result.load('pypi-probe.npz').electric, result.electric)
          assert (package.parent / 'web' / 'index.html').is_file()
          print(json.dumps({'package': str(package), 'version': importlib.metadata.version('torchfdtd'), 'backend': result.summary['backend'], 'steps': result.summary['steps'], 'field_peak': float(np.max(np.abs(result.electric)))}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pypi-download-verification
          path: pypi-download-verification.json
